<svg width="640" height="280" viewBox="0 0 640 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Arrow Marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 Z" fill="#000000" />
    </marker>
  </defs>

  <!-- Transparent Background -->
  <rect width="100%" height="100%" fill="none" />

  <!-- Title -->
  <text x="320" y="25" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#000000" text-anchor="middle">Forma Direta II - Canônica (Filtro IIR de 2ª Ordem)</text>

  <!-- ================= INPUT SECTION (LEFT) ================= -->
  <text x="30" y="55" font-family="Georgia, serif" font-size="12" font-style="italic" fill="#000000">x[k]</text>
  <line x1="60" y1="60" x2="108" y2="60" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)" />
  
  <!-- Left Main Adder (Feedback summation) -->
  <circle cx="120" cy="60" r="10" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
  <line x1="115" y1="60" x2="125" y2="60" stroke="#000000" stroke-width="1.2" />
  <line x1="120" y1="55" x2="120" y2="65" stroke="#000000" stroke-width="1.2" />
  
  <line x1="130" y1="60" x2="295" y2="60" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)" />

  <!-- ================= CENTRAL SHARED DELAY LINE ================= -->
  <!-- State node w[k] -->
  <circle cx="300" cy="60" r="3.5" fill="#000000" />
  <text x="300" y="50" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#64748b" text-anchor="middle">w[k]</text>
  
  <!-- Vertical Delay Path -->
  <line x1="300" y1="60" x2="300" y2="230" stroke="#000000" stroke-width="1.5" />
  
  <!-- Delay Box 1 -->
  <rect x="275" y="90" width="50" height="30" rx="4" fill="#fcd5b5" stroke="#000000" stroke-width="1.2" />
  <text x="300" y="110" font-family="Georgia, serif" font-size="13" font-style="italic" fill="#000000" text-anchor="middle">z⁻¹</text>
  
  <!-- State node w[k-1] -->
  <circle cx="300" cy="140" r="3.5" fill="#000000" />
  <text x="300" y="135" font-family="Georgia, serif" font-size="10" font-style="italic" fill="#64748b" text-anchor="end">w[k-1] </text>
  
  <!-- Delay Box 2 -->
  <rect x="275" y="170" width="50" height="30" rx="4" fill="#fcd5b5" stroke="#000000" stroke-width="1.2" />
  <text x="300" y="190" font-family="Georgia, serif" font-size="13" font-style="italic" fill="#000000" text-anchor="middle">z⁻¹</text>
  
  <!-- State node w[k-2] -->
  <circle cx="300" cy="220" r="3.5" fill="#000000" />
  <text x="300" y="215" font-family="Georgia, serif" font-size="10" font-style="italic" fill="#64748b" text-anchor="end">w[k-2] </text>

  <!-- ================= FEEDBACK SECTION (LEFT) ================= -->
  <!-- Feedback paths from state nodes to left adders -->
  <line x1="300" y1="140" x2="227" y2="140" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" />
  <line x1="300" y1="220" x2="227" y2="220" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" />
  
  <!-- Feedback Multipliers -->
  <!-- -a1 -->
  <path d="M 225 124 L 225 156 L 190 140 Z" fill="#ffffff" stroke="#000000" stroke-width="1.2" />
  <text x="212" y="145" font-family="Georgia, serif" font-size="13" font-style="italic" font-weight="bold" fill="#000000" text-anchor="middle">-a₁</text>
  
  <!-- -a2 -->
  <path d="M 225 204 L 225 236 L 190 220 Z" fill="#ffffff" stroke="#000000" stroke-width="1.2" />
  <text x="212" y="225" font-family="Georgia, serif" font-size="13" font-style="italic" font-weight="bold" fill="#000000" text-anchor="middle">-a₂</text>

  <!-- Feedback adders -->
  <!-- Bottom Feedback Adder -->
  <circle cx="120" cy="220" r="8" fill="#ffffff" stroke="#000000" stroke-width="1.2" />
  <line x1="116" y1="220" x2="124" y2="220" stroke="#000000" stroke-width="0.8" />
  <line x1="120" y1="216" x2="120" y2="224" stroke="#000000" stroke-width="0.8" />
  <line x1="190" y1="220" x2="128" y2="220" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" />
  
  <!-- Middle Feedback Adder -->
  <circle cx="120" cy="140" r="8" fill="#ffffff" stroke="#000000" stroke-width="1.2" />
  <line x1="116" y1="140" x2="124" y2="140" stroke="#000000" stroke-width="0.8" />
  <line x1="120" y1="136" x2="120" y2="144" stroke="#000000" stroke-width="0.8" />
  <line x1="190" y1="140" x2="128" y2="140" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" />
  
  <!-- Connect feedback adders up to Left Main Adder -->
  <line x1="120" y1="212" x2="120" y2="148" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" />
  <line x1="120" y1="132" x2="120" y2="70" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" />

  <!-- ================= FEEDFORWARD SECTION (RIGHT) ================= -->
  <!-- Top path from w[k] to b0 multiplier -->
  <line x1="300" y1="60" x2="373" y2="60" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)" />
  
  <!-- Feedforward paths from state nodes to right multipliers -->
  <line x1="300" y1="140" x2="373" y2="140" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" />
  <line x1="300" y1="220" x2="373" y2="220" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" />

  <!-- Feedforward Multipliers -->
  <!-- b0 -->
  <path d="M 375 44 L 375 76 L 410 60 Z" fill="#ffffff" stroke="#000000" stroke-width="1.2" />
  <text x="388" y="65" font-family="Georgia, serif" font-size="13" font-style="italic" font-weight="bold" fill="#000000" text-anchor="middle">b₀</text>
  
  <!-- b1 -->
  <path d="M 375 124 L 375 156 L 410 140 Z" fill="#ffffff" stroke="#000000" stroke-width="1.2" />
  <text x="388" y="145" font-family="Georgia, serif" font-size="13" font-style="italic" font-weight="bold" fill="#000000" text-anchor="middle">b₁</text>
  
  <!-- b2 -->
  <path d="M 375 204 L 375 236 L 410 220 Z" fill="#ffffff" stroke="#000000" stroke-width="1.2" />
  <text x="388" y="225" font-family="Georgia, serif" font-size="13" font-style="italic" font-weight="bold" fill="#000000" text-anchor="middle">b₂</text>

  <!-- Feedforward Adders -->
  <!-- Bottom Feedforward Adder -->
  <circle cx="480" cy="220" r="8" fill="#ffffff" stroke="#000000" stroke-width="1.2" />
  <line x1="476" y1="220" x2="484" y2="220" stroke="#000000" stroke-width="0.8" />
  <line x1="480" y1="216" x2="480" y2="224" stroke="#000000" stroke-width="0.8" />
  <line x1="410" y1="220" x2="472" y2="220" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" />
  
  <!-- Middle Feedforward Adder -->
  <circle cx="480" cy="140" r="8" fill="#ffffff" stroke="#000000" stroke-width="1.2" />
  <line x1="476" y1="140" x2="484" y2="140" stroke="#000000" stroke-width="0.8" />
  <line x1="480" y1="136" x2="480" y2="144" stroke="#000000" stroke-width="0.8" />
  <line x1="410" y1="140" x2="472" y2="140" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" />
  <line x1="480" y1="212" x2="480" y2="148" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" />

  <!-- Right Main Adder (Feedforward summation) -->
  <circle cx="480" cy="60" r="10" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
  <line x1="475" y1="60" x2="485" y2="60" stroke="#000000" stroke-width="1.2" />
  <line x1="480" y1="55" x2="480" y2="65" stroke="#000000" stroke-width="1.2" />
  
  <line x1="410" y1="60" x2="470" y2="60" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="480" y1="132" x2="480" y2="70" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" />

  <!-- Connection to Output -->
  <line x1="490" y1="60" x2="568" y2="60" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)" />
  <text x="580" y="55" font-family="Georgia, serif" font-size="12" font-style="italic" fill="#000000">y[k]</text>
</svg>
