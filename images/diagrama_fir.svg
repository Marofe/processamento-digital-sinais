<svg width="950" height="260" viewBox="0 0 950 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Arrow Marker matching the sharp black arrowheads of existing diagrams -->
    <marker id="axisArrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 Z" fill="#000000" />
    </marker>
  </defs>

  <!-- Transparent Background -->
  <rect width="100%" height="100%" fill="none" />

  <!-- Annotations (Sans-serif like in pid_discreto.png and sistema_discreto.png) -->
  <text x="30" y="240" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#475569" letter-spacing="0.05em">ESTRUTURA EM FORMA DIRETA (FILTRO FIR)</text>

  <!-- ================= INPUT SECTION ================= -->
  <!-- Serif italic math symbol for variables, matching existing diagrams -->
  <text x="20" y="56" font-family="Georgia, 'Times New Roman', serif" font-size="19" font-style="italic" font-weight="bold" fill="#000000">x[k]</text>
  <!-- Annotation below variable -->
  <text x="20" y="72" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#000000">entrada</text>
  
  <line x1="60" y1="50" x2="93" y2="50" stroke="#000000" stroke-width="1.5" marker-end="url(#axisArrow)" />

  <!-- ================= TOP DELAY LINE ================= -->
  <!-- Branching Node 0 -->
  <circle cx="100" cy="50" r="3.5" fill="#000000" />
  <line x1="100" y1="50" x2="153" y2="50" stroke="#000000" stroke-width="1.5" marker-end="url(#axisArrow)" />

  <!-- Delay 1 (z^-1) - Peach/Orange rounded rect matching the "atraso" block -->
  <rect x="160" y="30" width="60" height="40" rx="8" ry="8" fill="#fcd5b5" stroke="#000000" stroke-width="1.5" />
  <text x="190" y="55" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-style="italic" font-weight="bold" fill="#000000" text-anchor="middle">z⁻¹</text>
  <line x1="220" y1="50" x2="275" y2="50" stroke="#000000" stroke-width="1.5" />

  <!-- Branching Node 1 -->
  <circle cx="280" cy="50" r="3.5" fill="#000000" />
  <line x1="280" y1="50" x2="333" y2="50" stroke="#000000" stroke-width="1.5" marker-end="url(#axisArrow)" />

  <!-- Delay 2 (z^-1) -->
  <rect x="340" y="30" width="60" height="40" rx="8" ry="8" fill="#fcd5b5" stroke="#000000" stroke-width="1.5" />
  <text x="370" y="55" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-style="italic" font-weight="bold" fill="#000000" text-anchor="middle">z⁻¹</text>
  <line x1="400" y1="50" x2="455" y2="50" stroke="#000000" stroke-width="1.5" />

  <!-- Branching Node 2 -->
  <circle cx="460" cy="50" r="3.5" fill="#000000" />
  <line x1="460" y1="50" x2="513" y2="50" stroke="#000000" stroke-width="1.5" marker-end="url(#axisArrow)" />

  <!-- Delay 3 (z^-1) -->
  <rect x="520" y="30" width="60" height="40" rx="8" ry="8" fill="#fcd5b5" stroke="#000000" stroke-width="1.5" />
  <text x="550" y="55" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-style="italic" font-weight="bold" fill="#000000" text-anchor="middle">z⁻¹</text>
  <line x1="580" y1="50" x2="630" y2="50" stroke="#000000" stroke-width="1.5" />

  <!-- Continuation Dots -->
  <circle cx="645" cy="50" r="2.5" fill="#475569" />
  <circle cx="660" cy="50" r="2.5" fill="#475569" />
  <circle cx="675" cy="50" r="2.5" fill="#475569" />
  
  <line x1="690" y1="50" x2="708" y2="50" stroke="#000000" stroke-width="1.5" marker-end="url(#axisArrow)" />

  <!-- Delay M (z^-1) -->
  <rect x="715" y="30" width="60" height="40" rx="8" ry="8" fill="#fcd5b5" stroke="#000000" stroke-width="1.5" />
  <text x="745" y="55" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-style="italic" font-weight="bold" fill="#000000" text-anchor="middle">z⁻¹</text>
  <line x1="775" y1="50" x2="815" y2="50" stroke="#000000" stroke-width="1.5" />

  <!-- Branching Node M -->
  <circle cx="820" cy="50" r="3.5" fill="#000000" />

  <!-- ================= VERTICAL PATHS / COEF MULTIPLIERS ================= -->
  <!-- Multipliers designed as white downward pointing triangles with black borders -->
  <!-- Branch 0 -->
  <line x1="100" y1="50" x2="100" y2="93" stroke="#000000" stroke-width="1.5" marker-end="url(#axisArrow)" />
  <path d="M 82 100 L 118 100 L 100 135 Z" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
  <text x="100" y="115" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-style="italic" font-weight="bold" fill="#000000" text-anchor="middle">b₀</text>

  <!-- Branch 1 -->
  <line x1="280" y1="50" x2="280" y2="93" stroke="#000000" stroke-width="1.5" marker-end="url(#axisArrow)" />
  <path d="M 262 100 L 298 100 L 280 135 Z" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
  <text x="280" y="115" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-style="italic" font-weight="bold" fill="#000000" text-anchor="middle">b₁</text>

  <!-- Branch 2 -->
  <line x1="460" y1="50" x2="460" y2="93" stroke="#000000" stroke-width="1.5" marker-end="url(#axisArrow)" />
  <path d="M 442 100 L 478 100 L 460 135 Z" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
  <text x="460" y="115" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-style="italic" font-weight="bold" fill="#000000" text-anchor="middle">b₂</text>

  <!-- Branch M -->
  <line x1="820" y1="50" x2="820" y2="93" stroke="#000000" stroke-width="1.5" marker-end="url(#axisArrow)" />
  <path d="M 802 100 L 838 100 L 820 135 Z" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
  <!-- Subscript handled beautifully in SVG using tspan -->
  <text x="820" y="115" font-family="Georgia, 'Times New Roman', serif" font-size="12" font-style="italic" font-weight="bold" fill="#000000" text-anchor="middle">
    b<tspan font-size="9" dy="2">M</tspan>
  </text>

  <!-- ================= ACCUMULATION PATH (ADDERS) ================= -->
  <!-- Line from Mult 0 down and right -->
  <line x1="100" y1="135" x2="100" y2="190" stroke="#000000" stroke-width="1.5" />
  <line x1="100" y1="190" x2="258" y2="190" stroke="#000000" stroke-width="1.5" marker-end="url(#axisArrow)" />

  <!-- Adder 1 - Circle with plus sign, white background and black stroke -->
  <circle cx="280" cy="190" r="14" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
  <!-- Plus Sign -->
  <line x1="273" y1="190" x2="287" y2="190" stroke="#000000" stroke-width="1.5" />
  <line x1="280" y1="183" x2="280" y2="197" stroke="#000000" stroke-width="1.5" />
  <!-- Line from Mult 1 to Adder 1 -->
  <line x1="280" y1="135" x2="280" y2="171" stroke="#000000" stroke-width="1.5" marker-end="url(#axisArrow)" />
  <line x1="294" y1="190" x2="438" y2="190" stroke="#000000" stroke-width="1.5" marker-end="url(#axisArrow)" />

  <!-- Adder 2 -->
  <circle cx="460" cy="190" r="14" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
  <!-- Plus Sign -->
  <line x1="453" y1="190" x2="467" y2="190" stroke="#000000" stroke-width="1.5" />
  <line x1="460" y1="183" x2="460" y2="197" stroke="#000000" stroke-width="1.5" />
  <!-- Line from Mult 2 to Adder 2 -->
  <line x1="460" y1="135" x2="460" y2="171" stroke="#000000" stroke-width="1.5" marker-end="url(#axisArrow)" />
  <line x1="474" y1="190" x2="520" y2="190" stroke="#000000" stroke-width="1.5" />

  <!-- Dashed Line and Dots on Accumulation Path -->
  <line x1="520" y1="190" x2="620" y2="190" stroke="#000000" stroke-width="1.5" stroke-dasharray="4,4" />
  <circle cx="645" cy="190" r="2.5" fill="#475569" />
  <circle cx="660" cy="190" r="2.5" fill="#475569" />
  <circle cx="675" cy="190" r="2.5" fill="#475569" />
  <line x1="690" y1="190" x2="798" y2="190" stroke="#000000" stroke-width="1.5" marker-end="url(#axisArrow)" />

  <!-- Adder M -->
  <circle cx="820" cy="190" r="14" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
  <!-- Plus Sign -->
  <line x1="813" y1="190" x2="827" y2="190" stroke="#000000" stroke-width="1.5" />
  <line x1="820" y1="183" x2="820" y2="197" stroke="#000000" stroke-width="1.5" />
  <!-- Line from Mult M to Adder M -->
  <line x1="820" y1="135" x2="820" y2="171" stroke="#000000" stroke-width="1.5" marker-end="url(#axisArrow)" />

  <!-- ================= OUTPUT SECTION ================= -->
  <line x1="834" y1="190" x2="893" y2="190" stroke="#000000" stroke-width="1.5" marker-end="url(#axisArrow)" />
  <text x="910" y="196" font-family="Georgia, 'Times New Roman', serif" font-size="19" font-style="italic" font-weight="bold" fill="#000000">y[k]</text>
  <text x="910" y="212" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#000000">saída</text>

  <!-- Labels for Nodes (Serif Math Italicized font matching pid_discreto) -->
  <text x="110" y="80" font-family="Georgia, 'Times New Roman', serif" font-size="11" font-style="italic" fill="#000000">x[k]</text>
  <text x="290" y="80" font-family="Georgia, 'Times New Roman', serif" font-size="11" font-style="italic" fill="#000000">x[k-1]</text>
  <text x="470" y="80" font-family="Georgia, 'Times New Roman', serif" font-size="11" font-style="italic" fill="#000000">x[k-2]</text>
  <text x="830" y="80" font-family="Georgia, 'Times New Roman', serif" font-size="11" font-style="italic" fill="#000000">
    x[k-<tspan font-size="9" dy="1">M</tspan>]
  </text>
</svg>
