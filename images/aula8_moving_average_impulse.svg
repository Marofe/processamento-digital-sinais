<svg width="600" height="320" viewBox="0 0 600 320" xmlns="http://www.w3.org/2000/svg">
  <!-- Transparent Background -->
  <rect width="100%" height="100%" fill="none" />

  <!-- Plot Box (MATLAB Style) -->
  <rect x="80" y="50" width="450" height="200" fill="#ffffff" stroke="#000000" stroke-width="0.8" />
  
  <!-- Thin Grid Lines (Y-axis grid) -->
  <line x1="80" y1="160" x2="530" y2="160" stroke="#f1f5f9" stroke-width="0.6" />
  <line x1="80" y1="110" x2="530" y2="110" stroke="#f1f5f9" stroke-width="0.6" />
  <line x1="80" y1="60" x2="530" y2="60" stroke="#f1f5f9" stroke-width="0.6" />
  
  <!-- Thin Grid Lines (X-axis grid) -->
  <line x1="90" y1="50" x2="90" y2="250" stroke="#f1f5f9" stroke-width="0.6" />
  <line x1="135" y1="50" x2="135" y2="250" stroke="#f1f5f9" stroke-width="0.6" />
  <line x1="180" y1="50" x2="180" y2="250" stroke="#f1f5f9" stroke-width="0.6" />
  <line x1="225" y1="50" x2="225" y2="250" stroke="#f1f5f9" stroke-width="0.6" />
  <line x1="270" y1="50" x2="270" y2="250" stroke="#f1f5f9" stroke-width="0.6" />
  <line x1="315" y1="50" x2="315" y2="250" stroke="#f1f5f9" stroke-width="0.6" />
  <line x1="360" y1="50" x2="360" y2="250" stroke="#f1f5f9" stroke-width="0.6" />
  <line x1="405" y1="50" x2="405" y2="250" stroke="#f1f5f9" stroke-width="0.6" />
  <line x1="450" y1="50" x2="450" y2="250" stroke="#f1f5f9" stroke-width="0.6" />
  <line x1="495" y1="50" x2="495" y2="250" stroke="#f1f5f9" stroke-width="0.6" />

  <!-- Baseline (y = 0) -->
  <line x1="80" y1="210" x2="530" y2="210" stroke="#000000" stroke-width="0.8" />
  
  <!-- X ticks -->
  <line x1="90" y1="250" x2="90" y2="246" stroke="#000000" stroke-width="0.8" />
  <line x1="135" y1="250" x2="135" y2="246" stroke="#000000" stroke-width="0.8" />
  <line x1="180" y1="250" x2="180" y2="246" stroke="#000000" stroke-width="0.8" />
  <line x1="225" y1="250" x2="225" y2="246" stroke="#000000" stroke-width="0.8" />
  <line x1="270" y1="250" x2="270" y2="246" stroke="#000000" stroke-width="0.8" />
  <line x1="315" y1="250" x2="315" y2="246" stroke="#000000" stroke-width="0.8" />
  <line x1="360" y1="250" x2="360" y2="246" stroke="#000000" stroke-width="0.8" />
  <line x1="405" y1="250" x2="405" y2="246" stroke="#000000" stroke-width="0.8" />
  <line x1="450" y1="250" x2="450" y2="246" stroke="#000000" stroke-width="0.8" />
  <line x1="495" y1="250" x2="495" y2="246" stroke="#000000" stroke-width="0.8" />
  
  <!-- Y ticks -->
  <line x1="80" y1="210" x2="85" y2="210" stroke="#000000" stroke-width="0.8" />
  <line x1="80" y1="160" x2="85" y2="160" stroke="#000000" stroke-width="0.8" />
  <line x1="80" y1="110" x2="85" y2="110" stroke="#000000" stroke-width="0.8" />
  <line x1="80" y1="60" x2="85" y2="60" stroke="#000000" stroke-width="0.8" />

  <!-- Axis labels -->
  <text x="305" y="275" font-family="Arial, sans-serif" font-size="10.5" fill="#000000" text-anchor="middle">Amostras (k)</text>
  <text x="30" y="150" font-family="Arial, sans-serif" font-size="11" fill="#000000" text-anchor="middle" transform="rotate(-90 30 150)">g[k]</text>

  <!-- Tick values -->
  <text x="90" y="262" font-family="Arial, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">-2</text>
  <text x="135" y="262" font-family="Arial, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">-1</text>
  <text x="180" y="262" font-family="Arial, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">0</text>
  <text x="225" y="262" font-family="Arial, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">1</text>
  <text x="270" y="262" font-family="Arial, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">2</text>
  <text x="315" y="262" font-family="Arial, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">3</text>
  <text x="360" y="262" font-family="Arial, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">4</text>
  <text x="405" y="262" font-family="Arial, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">5</text>
  <text x="450" y="262" font-family="Arial, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">6</text>
  <text x="495" y="262" font-family="Arial, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">7</text>

  <text x="72" y="213" font-family="Arial, sans-serif" font-size="9" fill="#64748b" text-anchor="end">0.0</text>
  <text x="72" y="163" font-family="Arial, sans-serif" font-size="9" fill="#64748b" text-anchor="end">0.1</text>
  <text x="72" y="113" font-family="Arial, sans-serif" font-size="9" fill="#64748b" text-anchor="end">0.2</text>
  <text x="72" y="63" font-family="Arial, sans-serif" font-size="9" fill="#64748b" text-anchor="end">0.3</text>

  <!-- Title -->
  <text x="305" y="30" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#0072bd" text-anchor="middle">Resposta ao Impulso: Média Móvel de Ordem M = 4 (N = 5)</text>

  <!-- STEMS (g[k] = 1/5 = 0.2 para k=0..4) -->
  <!-- k = -2, -1 (0.0) -->
  <circle cx="90" cy="210" r="4.5" fill="#0072bd" />
  <circle cx="135" cy="210" r="4.5" fill="#0072bd" />

  <!-- k = 0..4 (0.2) -->
  <line x1="180" y1="210" x2="180" y2="110" stroke="#0072bd" stroke-width="2.5" />
  <circle cx="180" cy="110" r="4.5" fill="#0072bd" />

  <line x1="225" y1="210" x2="225" y2="110" stroke="#0072bd" stroke-width="2.5" />
  <circle cx="225" cy="110" r="4.5" fill="#0072bd" />

  <line x1="270" y1="210" x2="270" y2="110" stroke="#0072bd" stroke-width="2.5" />
  <circle cx="270" cy="110" r="4.5" fill="#0072bd" />

  <line x1="315" y1="210" x2="315" y2="110" stroke="#0072bd" stroke-width="2.5" />
  <circle cx="315" cy="110" r="4.5" fill="#0072bd" />

  <line x1="360" y1="210" x2="360" y2="110" stroke="#0072bd" stroke-width="2.5" />
  <circle cx="360" cy="110" r="4.5" fill="#0072bd" />

  <!-- k = 5, 6, 7 (0.0) -->
  <circle cx="405" cy="210" r="4.5" fill="#0072bd" />
  <circle cx="450" cy="210" r="4.5" fill="#0072bd" />
  <circle cx="495" cy="210" r="4.5" fill="#0072bd" />

  <!-- Dashed lines showing amplitude value -->
  <line x1="80" y1="110" x2="360" y2="110" stroke="#0072bd" stroke-width="1.2" stroke-dasharray="3,3" />
  <rect x="95" y="93" width="70" height="15" rx="3" fill="#0072bd" />
  <text x="130" y="104" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#ffffff" text-anchor="middle">g[k] = 1/5 = 0.2</text>

  <!-- Brackets indicating finite duration -->
  <path d="M 165 228 L 165 236 L 375 236 L 375 228" fill="none" stroke="#475569" stroke-width="1" />
  <text x="270" y="247" font-family="Arial, sans-serif" font-size="9.5" fill="#475569" text-anchor="middle">Duração Finita: N = M + 1 = 5 amostras</text>

  <!-- Formula box -->
  <rect x="380" y="70" width="135" height="48" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
  <text x="447" y="86" font-family="Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#0f172a" text-anchor="middle">g[k] = 1/5,  0 ≤ k ≤ 4</text>
  <text x="447" y="103" font-family="Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#0f172a" text-anchor="middle">g[k] = 0,  outros casos</text>
</svg>
