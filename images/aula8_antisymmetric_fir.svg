<svg width="550" height="280" viewBox="0 0 550 280" xmlns="http://www.w3.org/2000/svg">
  <!-- Transparent Background -->
  <rect width="100%" height="100%" fill="none" />

  <!-- Grid Lines -->
  <!-- Horizontal Grid Lines -->
  <line x1="65" y1="60" x2="480" y2="60" stroke="#e0e0e0" stroke-width="0.6" />
  <line x1="65" y1="99" x2="480" y2="99" stroke="#e0e0e0" stroke-width="0.6" />
  <line x1="65" y1="177" x2="480" y2="177" stroke="#e0e0e0" stroke-width="0.6" />
  <line x1="65" y1="215" x2="480" y2="215" stroke="#e0e0e0" stroke-width="0.6" />

  <!-- Vertical Grid Lines -->
  <line x1="95" y1="45" x2="95" y2="230" stroke="#e0e0e0" stroke-width="0.6" />
  <line x1="150" y1="45" x2="150" y2="230" stroke="#e0e0e0" stroke-width="0.6" />
  <line x1="205" y1="45" x2="205" y2="230" stroke="#e0e0e0" stroke-width="0.6" />
  <line x1="260" y1="45" x2="260" y2="230" stroke="#e0e0e0" stroke-width="0.6" />
  <line x1="315" y1="45" x2="315" y2="230" stroke="#e0e0e0" stroke-width="0.6" />
  <line x1="370" y1="45" x2="370" y2="230" stroke="#e0e0e0" stroke-width="0.6" />
  <line x1="425" y1="45" x2="425" y2="230" stroke="#e0e0e0" stroke-width="0.6" />

  <!-- Baseline (y = 0) in the middle of y range [-1.2, 1.2] -->
  <line x1="65" y1="138" x2="480" y2="138" stroke="#000000" stroke-width="0.8" />

  <!-- Outer Plot Frame/Box -->
  <rect x="65" y="45" width="415" height="185" fill="none" stroke="#000000" stroke-width="0.8" />

  <!-- Inward Ticks on Frame -->
  <!-- Bottom Ticks -->
  <line x1="95" y1="230" x2="95" y2="225" stroke="#000000" stroke-width="0.8" />
  <line x1="150" y1="230" x2="150" y2="225" stroke="#000000" stroke-width="0.8" />
  <line x1="205" y1="230" x2="205" y2="225" stroke="#000000" stroke-width="0.8" />
  <line x1="260" y1="230" x2="260" y2="225" stroke="#000000" stroke-width="0.8" />
  <line x1="315" y1="230" x2="315" y2="225" stroke="#000000" stroke-width="0.8" />
  <line x1="370" y1="230" x2="370" y2="225" stroke="#000000" stroke-width="0.8" />
  <line x1="425" y1="230" x2="425" y2="225" stroke="#000000" stroke-width="0.8" />
  
  <!-- Top Ticks -->
  <line x1="95" y1="45" x2="95" y2="50" stroke="#000000" stroke-width="0.8" />
  <line x1="150" y1="45" x2="150" y2="50" stroke="#000000" stroke-width="0.8" />
  <line x1="205" y1="45" x2="205" y2="50" stroke="#000000" stroke-width="0.8" />
  <line x1="260" y1="45" x2="260" y2="50" stroke="#000000" stroke-width="0.8" />
  <line x1="315" y1="45" x2="315" y2="50" stroke="#000000" stroke-width="0.8" />
  <line x1="370" y1="45" x2="370" y2="50" stroke="#000000" stroke-width="0.8" />
  <line x1="425" y1="45" x2="425" y2="50" stroke="#000000" stroke-width="0.8" />

  <!-- Left Ticks -->
  <line x1="65" y1="60" x2="70" y2="60" stroke="#000000" stroke-width="0.8" />
  <line x1="65" y1="99" x2="70" y2="99" stroke="#000000" stroke-width="0.8" />
  <line x1="65" y1="138" x2="70" y2="138" stroke="#000000" stroke-width="0.8" />
  <line x1="65" y1="177" x2="70" y2="177" stroke="#000000" stroke-width="0.8" />
  <line x1="65" y1="215" x2="70" y2="215" stroke="#000000" stroke-width="0.8" />

  <!-- Right Ticks -->
  <line x1="480" y1="60" x2="475" y2="60" stroke="#000000" stroke-width="0.8" />
  <line x1="480" y1="99" x2="475" y2="99" stroke="#000000" stroke-width="0.8" />
  <line x1="480" y1="138" x2="475" y2="138" stroke="#000000" stroke-width="0.8" />
  <line x1="480" y1="177" x2="475" y2="177" stroke="#000000" stroke-width="0.8" />
  <line x1="480" y1="215" x2="475" y2="215" stroke="#000000" stroke-width="0.8" />

  <!-- Axis Labels -->
  <!-- X values -->
  <text x="95" y="246" font-family="Arial, sans-serif" font-size="10" fill="#000000" text-anchor="middle">0</text>
  <text x="150" y="246" font-family="Arial, sans-serif" font-size="10" fill="#000000" text-anchor="middle">1</text>
  <text x="205" y="246" font-family="Arial, sans-serif" font-size="10" fill="#000000" text-anchor="middle">2</text>
  <text x="260" y="246" font-family="Arial, sans-serif" font-size="10" fill="#000000" text-anchor="middle">3</text>
  <text x="315" y="246" font-family="Arial, sans-serif" font-size="10" fill="#000000" text-anchor="middle">4</text>
  <text x="370" y="246" font-family="Arial, sans-serif" font-size="10" fill="#000000" text-anchor="middle">5</text>
  <text x="425" y="246" font-family="Arial, sans-serif" font-size="10" fill="#000000" text-anchor="middle">6</text>

  <!-- Y values -->
  <text x="56" y="63" font-family="Arial, sans-serif" font-size="10" fill="#000000" text-anchor="end">1.0</text>
  <text x="56" y="102" font-family="Arial, sans-serif" font-size="10" fill="#000000" text-anchor="end">0.5</text>
  <text x="56" y="141" font-family="Arial, sans-serif" font-size="10" fill="#000000" text-anchor="end">0.0</text>
  <text x="56" y="180" font-family="Arial, sans-serif" font-size="10" fill="#000000" text-anchor="end">-0.5</text>
  <text x="56" y="218" font-family="Arial, sans-serif" font-size="10" fill="#000000" text-anchor="end">-1.0</text>

  <!-- Axis Titles -->
  <text x="272" y="265" font-family="Arial, sans-serif" font-size="11" fill="#000000" text-anchor="middle">Índice da Amostra (k)</text>
  <text x="18" y="137" font-family="Arial, sans-serif" font-size="11" fill="#000000" text-anchor="middle" transform="rotate(-90 18 137)">Amplitude</text>
  <text x="272" y="30" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle">Filtro FIR Antissimétrico: g[k] = -g[M-k]</text>

  <!-- ================= STEMS (ANTI-SYMMETRIC DATA) ================= -->
  <!-- n = 0, h[0] = +0.125 (y=128) -->
  <line x1="95" y1="138" x2="95" y2="128" stroke="#0072bd" stroke-width="2.5" />
  <circle cx="95" cy="128" r="5.5" fill="#0072bd" />

  <!-- n = 1, h[1] = +0.4 (y=107) -->
  <line x1="150" y1="138" x2="150" y2="107" stroke="#0072bd" stroke-width="2.5" />
  <circle cx="150" cy="107" r="5.5" fill="#0072bd" />

  <!-- n = 2, h[2] = +0.75 (y=80) -->
  <line x1="205" y1="138" x2="205" y2="80" stroke="#0072bd" stroke-width="2.5" />
  <circle cx="205" cy="80" r="5.5" fill="#0072bd" />

  <!-- n = 3, h[3] = 0.0 (y=138) (CENTER OF ANTISYMMETRY MUST BE ZERO) -->
  <circle cx="260" cy="138" r="5.5" fill="#0072bd" />

  <!-- n = 4, h[4] = -0.75 (y=196) (INVERTED FROM n=2) -->
  <line x1="315" y1="138" x2="315" y2="196" stroke="#0072bd" stroke-width="2.5" />
  <circle cx="315" cy="196" r="5.5" fill="#0072bd" />

  <!-- n = 5, h[5] = -0.4 (y=169) (INVERTED FROM n=1) -->
  <line x1="370" y1="138" x2="370" y2="169" stroke="#0072bd" stroke-width="2.5" />
  <circle cx="370" cy="169" r="5.5" fill="#0072bd" />

  <!-- n = 6, h[6] = -0.125 (y=148) (INVERTED FROM n=0) -->
  <line x1="425" y1="138" x2="425" y2="148" stroke="#0072bd" stroke-width="2.5" />
  <circle cx="425" cy="148" r="5.5" fill="#0072bd" />

  <!-- ================= LINE OF ANTISYMMETRY ================= -->
  <!-- Red dashed line at M/2 = 3 -->
  <line x1="260" y1="45" x2="260" y2="230" stroke="#d90429" stroke-width="1.5" stroke-dasharray="4,3" />
</svg>
