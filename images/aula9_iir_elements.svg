<svg width="600" height="180" viewBox="0 0 600 180" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Arrow Marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 Z" fill="#000000" />
    </marker>
  </defs>

  <!-- Transparent Background -->
  <rect width="100%" height="100%" fill="none" />

  <!-- ================= 1. ELEMENTO DE ATRASO (DELAY) ================= -->
  <g transform="translate(10, 0)">
    <text x="90" y="25" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle">ATRASO UNITÁRIO</text>
    
    <rect x="60" y="45" width="60" height="40" rx="6" fill="#fcd5b5" stroke="#000000" stroke-width="1.5" />
    <foreignObject x="70" y="53" width="40" height="25">
      <div xmlns="http://www.w3.org/1999/xhtml" style="font-family: Georgia, serif; font-size: 15px; text-align: center; color: #000000; font-weight: bold; font-style: italic;">
        $z^{-1}$
      </div>
    </foreignObject>
    
    <line x1="15" y1="65" x2="53" y2="65" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)" />
    <line x1="120" y1="65" x2="158" y2="65" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)" />
    
    <foreignObject x="15" y="42" width="40" height="20">
      <div xmlns="http://www.w3.org/1999/xhtml" style="font-family: Georgia, serif; font-size: 11px; text-align: center; color: #000000;">
        $v[k]$
      </div>
    </foreignObject>

    <foreignObject x="120" y="42" width="50" height="20">
      <div xmlns="http://www.w3.org/1999/xhtml" style="font-family: Georgia, serif; font-size: 11px; text-align: center; color: #000000;">
        $v[k-1]$
      </div>
    </foreignObject>
    
    <text x="90" y="115" font-family="Arial, sans-serif" font-size="10" fill="#475569" text-anchor="middle">Memória de Estado</text>
    <foreignObject x="20" y="118" width="140" height="20">
      <div xmlns="http://www.w3.org/1999/xhtml" style="font-family: Georgia, serif; font-size: 11px; text-align: center; color: #64748b;">
        $y[k] = v[k-1]$
      </div>
    </foreignObject>
  </g>

  <!-- Divider Line -->
  <line x1="200" y1="20" x2="200" y2="150" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3,3" />

  <!-- ================= 2. MULTIPLICADORES (AVANÇO / REALIMENTAÇÃO) ================= -->
  <g transform="translate(210, 0)">
    <text x="90" y="25" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle">MULTIPLICADORES</text>
    
    <!-- Feedforward gain -->
    <path d="M 40 45 L 40 75 L 75 60 Z" fill="#ffffff" stroke="#000000" stroke-width="1.2" />
    <foreignObject x="38" y="50" width="25" height="20">
      <div xmlns="http://www.w3.org/1999/xhtml" style="font-family: Georgia, serif; font-size: 11px; text-align: center; color: #000000; font-weight: bold;">
        $b_i$
      </div>
    </foreignObject>
    <text x="55" y="40" font-family="Arial, sans-serif" font-size="9" fill="#0284c7" text-anchor="middle">Direto</text>

    <!-- Feedback gain -->
    <path d="M 105 45 L 105 75 L 140 60 Z" fill="#ffffff" stroke="#000000" stroke-width="1.2" />
    <foreignObject x="105" y="50" width="30" height="20">
      <div xmlns="http://www.w3.org/1999/xhtml" style="font-family: Georgia, serif; font-size: 11px; text-align: center; color: #000000; font-weight: bold;">
        $-a_j$
      </div>
    </foreignObject>
    <text x="122" y="40" font-family="Arial, sans-serif" font-size="9" fill="#b91c1c" text-anchor="middle">Realiment.</text>

    <!-- Flow Lines -->
    <line x1="10" y1="60" x2="33" y2="60" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" />
    <line x1="75" y1="60" x2="98" y2="60" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" />
    
    <text x="90" y="115" font-family="Arial, sans-serif" font-size="10" fill="#475569" text-anchor="middle">Ganhos do Filtro</text>
    <foreignObject x="10" y="118" width="160" height="20">
      <div xmlns="http://www.w3.org/1999/xhtml" style="font-family: Georgia, serif; font-size: 11px; text-align: center; color: #64748b;">
        $b_i$ (zeros) / $-a_j$ (polos)
      </div>
    </foreignObject>
  </g>

  <!-- Divider Line -->
  <line x1="410" y1="20" x2="410" y2="150" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3,3" />

  <!-- ================= 3. SOMADOR (ADDER) ================= -->
  <g transform="translate(420, 0)">
    <text x="90" y="25" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle">SOMADOR</text>
    
    <circle cx="80" cy="65" r="14" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
    <line x1="73" y1="65" x2="87" y2="65" stroke="#000000" stroke-width="1.5" />
    <line x1="80" y1="58" x2="80" y2="72" stroke="#000000" stroke-width="1.5" />
    
    <line x1="15" y1="65" x2="59" y2="65" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)" />
    <line x1="80" y1="28" x2="80" y2="46" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)" />
    <line x1="94" y1="65" x2="148" y2="65" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)" />
    
    <foreignObject x="15" y="42" width="40" height="20">
      <div xmlns="http://www.w3.org/1999/xhtml" style="font-family: Georgia, serif; font-size: 11px; text-align: center; color: #000000;">
        $A[k]$
      </div>
    </foreignObject>

    <foreignObject x="98" y="25" width="40" height="20">
      <div xmlns="http://www.w3.org/1999/xhtml" style="font-family: Georgia, serif; font-size: 11px; color: #000000;">
        $B[k]$
      </div>
    </foreignObject>

    <foreignObject x="105" y="42" width="65" height="20">
      <div xmlns="http://www.w3.org/1999/xhtml" style="font-family: Georgia, serif; font-size: 10px; text-align: center; color: #000000;">
        $A[k] + B[k]$
      </div>
    </foreignObject>
    
    <text x="90" y="115" font-family="Arial, sans-serif" font-size="10" fill="#475569" text-anchor="middle">Acumulador Linear</text>
    <foreignObject x="20" y="118" width="140" height="20">
      <div xmlns="http://www.w3.org/1999/xhtml" style="font-family: Georgia, serif; font-size: 11px; text-align: center; color: #64748b;">
        $y[k] = A[k] + B[k]$
      </div>
    </foreignObject>
  </g>
</svg>
