  <!-- n = 2, h[2] = 1.0 (y=71) -->
  <line x1="250" y1="203" x2="250" y2="71" stroke="#0072bd" stroke-width="2.5" />
  <circle cx="250" cy="71" r="5.5" fill="#0072bd" />

  <!-- n = 3, h[3] = 0.5 (y=138) -->
  <line x1="320" y1="203" x2="320" y2="138" stroke="#0072bd" stroke-width="2.5" />
  <circle cx="320" cy="138" r="5.5" fill="#0072bd" />

  <!-- n = 4, h[4] = 0.15 (y=183) -->
  <line x1="390" y1="203" x2="390" y2="183" stroke="#0072bd" stroke-width="2.5" />
