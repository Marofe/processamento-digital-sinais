  <text x="110" y="246" font-family="Arial, sans-serif" font-size="10" fill="#000000" text-anchor="middle">0</text>
  <text x="180" y="246" font-family="Arial, sans-serif" font-size="10" fill="#000000" text-anchor="middle">1</text>
