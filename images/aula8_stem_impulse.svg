  <line x1="390" y1="230" x2="390" y2="225" stroke="#000000" stroke-width="0.8" />
  
  <!-- Top Ticks -->
  <line x1="110" y1="45" x2="110" y2="50" stroke="#000000" stroke-width="0.8" />
