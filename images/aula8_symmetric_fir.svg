  <!-- Outer Plot Frame/Box -->
  <rect x="65" y="45" width="415" height="185" fill="none" stroke="#000000" stroke-width="0.8" />

  <!-- Inward Ticks on Frame -->
  <!-- Bottom Ticks -->
  <line x1="95" y1="230" x2="95" y2="225" stroke="#000000" stroke-width="0.8" />
  <line x1="150" y1="230" x2="150" y2="225" stroke="#000000" stroke-width="0.8" />
  <line x1="205" y1="230" x2="205" y2="225" stroke="#000000" stroke-width="0.8" />
  <line x1="260" y1="230" x2="260" y2="225" stroke="#000000" stroke-width="0.8" />
  <line x1="315" y1="230" x2="315" y2="225" stroke="#000000" stroke-width="0.8" />
  <line x1="370" y1="230" x2="370" y2="225" stroke="#000000" stroke-width="0.8" />
  <line x1="425" y1="230" x2="425" y2="225" stroke="#000000" stroke-width="0.8" />
  
