  <line x1="65" y1="124" x2="70" y2="124" stroke="#000000" stroke-width="0.8" />
  <line x1="65" y1="151" x2="70" y2="151" stroke="#000000" stroke-width="0.8" />
  <line x1="65" y1="177" x2="70" y2="177" stroke="#000000" stroke-width="0.8" />
