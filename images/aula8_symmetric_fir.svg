  <!-- Axis Labels -->
  <!-- X values -->
  <text x="95" y="246" font-family="Arial, sans-serif" font-size="10" fill="#000000" text-anchor="middle">0</text>
  <text x="150" y="246" font-family="Arial, sans-serif" font-size="10" fill="#000000" text-anchor="middle">1</text>
  <text x="205" y="246" font-family="Arial, sans-serif" font-size="10" fill="#000000" text-anchor="middle">2</text>
  <text x="260" y="246" font-family="Arial, sans-serif" font-size="10" fill="#000000" text-anchor="middle">3</text>
  <text x="315" y="246" font-family="Arial, sans-serif" font-size="10" fill="#000000" text-anchor="middle">4</text>
  <text x="370" y="246" font-family="Arial, sans-serif" font-size="10" fill="#000000" text-anchor="middle">5</text>
  <text x="425" y="246" font-family="Arial, sans-serif" font-size="10" fill="#000000" text-anchor="middle">6</text>

  <!-- Y values -->
  <text x="56" y="74" font-family="Arial, sans-serif" font-size="10" fill="#000000" text-anchor="end">1.0</text>
  <text x="56" y="101" font-family="Arial, sans-serif" font-size="10" fill="#000000" text-anchor="end">0.8</text>
  <text x="56" y="127" font-family="Arial, sans-serif" font-size="10" fill="#000000" text-anchor="end">0.6</text>
  <text x="56" y="154" font-family="Arial, sans-serif" font-size="10" fill="#000000" text-anchor="end">0.4</text>
  <text x="56" y="180" font-family="Arial, sans-serif" font-size="10" fill="#000000" text-anchor="end">0.2</text>
  <text x="56" y="206" font-family="Arial, sans-serif" font-size="10" fill="#000000" text-anchor="end">0.0</text>

  <!-- Axis Titles -->
  <text x="272" y="265" font-family="Arial, sans-serif" font-size="11" fill="#000000" text-anchor="middle">Índice da Amostra (k)</text>
  <text x="18" y="137" font-family="Arial, sans-serif" font-size="11" fill="#000000" text-anchor="middle" transform="rotate(-90 18 137)">Amplitude</text>
  <text x="272" y="30" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle">Filtro FIR Simétrico: g[k] = g[M-k]</text>

  <!-- ================= STEMS (SYMMETRIC DATA) ================= -->
  <!-- n = 0, h[0] = 0.08 (y=192) -->
  <line x1="95" y1="203" x2="95" y2="192" stroke="#0072bd" stroke-width="2.5" />
  <circle cx="95" cy="192" r="5.5" fill="#0072bd" />

  <!-- n = 1, h[1] = 0.25 (y=170) -->
  <line x1="150" y1="203" x2="150" y2="170" stroke="#0072bd" stroke-width="2.5" />
  <circle cx="150" cy="170" r="5.5" fill="#0072bd" />

  <!-- n = 2, h[2] = 0.625 (y=121) -->
  <line x1="205" y1="203" x2="205" y2="121" stroke="#0072bd" stroke-width="2.5" />
  <circle cx="205" cy="121" r="5.5" fill="#0072bd" />

  <!-- n = 3, h[3] = 1.0 (y=71) (CENTER OF SYMMETRY) -->
  <line x1="260" y1="203" x2="260" y2="71" stroke="#0072bd" stroke-width="2.5" />
  <circle cx="260" cy="71" r="5.5" fill="#0072bd" />

  <!-- n = 4, h[4] = 0.625 (y=121) -->
  <line x1="315" y1="203" x2="315" y2="121" stroke="#0072bd" stroke-width="2.5" />
  <circle cx="315" cy="121" r="5.5" fill="#0072bd" />

  <!-- n = 5, h[5] = 0.25 (y=170) -->
  <line x1="370" y1="203" x2="370" y2="170" stroke="#0072bd" stroke-width="2.5" />
  <circle cx="370" cy="170" r="5.5" fill="#0072bd" />

  <!-- n = 6, h[6] = 0.08 (y=192) -->
  <line x1="425" y1="203" x2="425" y2="192" stroke="#0072bd" stroke-width="2.5" />
  <circle cx="425" cy="192" r="5.5" fill="#0072bd" />

  <!-- ================= LINE OF SYMMETRY ================= -->
  <!-- Red dashed line at M/2 = 3 -->
  <line x1="260" y1="45" x2="260" y2="230" stroke="#d90429" stroke-width="1.5" stroke-dasharray="4,3" />
</svg>
