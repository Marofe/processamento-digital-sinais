<svg width="600" height="320" viewBox="0 0 600 320" xmlns="http://www.w3.org/2000/svg">
  <!-- Transparent Background -->
  <rect width="100%" height="100%" fill="none" />

  <!-- Plot Box (MATLAB Style) -->
  <rect x="80" y="50" width="450" height="200" fill="#ffffff" stroke="#000000" stroke-width="0.8" />
  
  <!-- Thin Grid Lines (Y-axis grid) -->
  <line x1="80" y1="150" x2="530" y2="150" stroke="#f1f5f9" stroke-width="0.6" />
  <line x1="80" y1="90" x2="530" y2="90" stroke="#f1f5f9" stroke-width="0.6" />
  
  <!-- Thin Grid Lines (X-axis grid) -->
  <line x1="110" y1="50" x2="110" y2="250" stroke="#f1f5f9" stroke-width="0.6" />
  <line x1="160" y1="50" x2="160" y2="250" stroke="#f1f5f9" stroke-width="0.6" />
  <line x1="210" y1="50" x2="210" y2="250" stroke="#f1f5f9" stroke-width="0.6" />
  <line x1="260" y1="50" x2="260" y2="250" stroke="#f1f5f9" stroke-width="0.6" />
  <line x1="310" y1="50" x2="310" y2="250" stroke="#f1f5f9" stroke-width="0.6" />
  <line x1="360" y1="50" x2="360" y2="250" stroke="#f1f5f9" stroke-width="0.6" />
  <line x1="410" y1="50" x2="410" y2="250" stroke="#f1f5f9" stroke-width="0.6" />
  <line x1="460" y1="50" x2="460" y2="250" stroke="#f1f5f9" stroke-width="0.6" />
  <line x1="510" y1="50" x2="510" y2="250" stroke="#f1f5f9" stroke-width="0.6" />

  <!-- Baseline (y = 0) -->
  <line x1="80" y1="210" x2="530" y2="210" stroke="#000000" stroke-width="0.8" />
  
  <!-- X ticks -->
  <line x1="110" y1="250" x2="110" y2="246" stroke="#000000" stroke-width="0.8" />
  <line x1="160" y1="250" x2="160" y2="246" stroke="#000000" stroke-width="0.8" />
  <line x1="210" y1="250" x2="210" y2="246" stroke="#000000" stroke-width="0.8" />
  <line x1="260" y1="250" x2="260" y2="246" stroke="#000000" stroke-width="0.8" />
  <line x1="310" y1="250" x2="310" y2="246" stroke="#000000" stroke-width="0.8" />
  <line x1="360" y1="250" x2="360" y2="246" stroke="#000000" stroke-width="0.8" />
  <line x1="410" y1="250" x2="410" y2="246" stroke="#000000" stroke-width="0.8" />
  <line x1="460" y1="250" x2="460" y2="246" stroke="#000000" stroke-width="0.8" />
  <line x1="510" y1="250" x2="510" y2="246" stroke="#000000" stroke-width="0.8" />
  
  <!-- Y ticks -->
  <line x1="80" y1="210" x2="85" y2="210" stroke="#000000" stroke-width="0.8" />
  <line x1="80" y1="150" x2="85" y2="150" stroke="#000000" stroke-width="0.8" />
  <line x1="80" y1="90" x2="85" y2="90" stroke="#000000" stroke-width="0.8" />

  <!-- Axis labels -->
  <text x="305" y="275" font-family="Arial, sans-serif" font-size="10.5" fill="#000000" text-anchor="middle">Amostras (k)</text>
  <text x="30" y="150" font-family="Arial, sans-serif" font-size="11" fill="#000000" text-anchor="middle" transform="rotate(-90 30 150)">g[k]</text>

  <!-- Tick values -->
  <text x="110" y="262" font-family="Arial, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">-2</text>
  <text x="160" y="262" font-family="Arial, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">-1</text>
  <text x="210" y="262" font-family="Arial, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">0</text>
  <text x="260" y="262" font-family="Arial, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">1</text>
  <text x="310" y="262" font-family="Arial, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">2</text>
  <text x="360" y="262" font-family="Arial, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">3</text>
  <text x="410" y="262" font-family="Arial, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">4</text>
  <text x="460" y="262" font-family="Arial, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">5</text>
  <text x="510" y="262" font-family="Arial, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">6</text>

  <text x="72" y="213" font-family="Arial, sans-serif" font-size="9" fill="#64748b" text-anchor="end">0.0</text>
  <text x="72" y="153" font-family="Arial, sans-serif" font-size="9" fill="#64748b" text-anchor="end">0.5</text>
  <text x="72" y="93" font-family="Arial, sans-serif" font-size="9" fill="#64748b" text-anchor="end">1.0</text>

  <!-- Title -->
  <text x="305" y="30" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#0072bd" text-anchor="middle">Resposta ao Impulso de um Filtro FIR de 2ª Ordem</text>

  <!-- STEMS (g[k] = b0*delta[k] + b1*delta[k-1] + b2*delta[k-2]) -->
  <!-- k = -2, -1 (0.0) -->
  <circle cx="110" cy="210" r="4.5" fill="#0072bd" />
  <circle cx="160" cy="210" r="4.5" fill="#0072bd" />

  <!-- k = 0 (b0 = 0.5) -->
  <line x1="210" y1="210" x2="210" y2="150" stroke="#0072bd" stroke-width="2.5" />
  <circle cx="210" cy="150" r="4.5" fill="#0072bd" />
  <text x="210" y="138" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#0072bd" text-anchor="middle">g[0] = b₀</text>
  <text x="210" y="126" font-family="Arial, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">(0.5)</text>

  <!-- k = 1 (b1 = 0.9) -->
  <line x1="260" y1="210" x2="260" y2="102" stroke="#0072bd" stroke-width="2.5" />
  <circle cx="260" cy="102" r="4.5" fill="#0072bd" />
  <text x="260" y="90" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#0072bd" text-anchor="middle">g[1] = b₁</text>
  <text x="260" y="78" font-family="Arial, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">(0.9)</text>

  <!-- k = 2 (b2 = 0.4) -->
  <line x1="310" y1="210" x2="310" y2="162" stroke="#0072bd" stroke-width="2.5" />
  <circle cx="310" cy="162" r="4.5" fill="#0072bd" />
  <text x="310" y="150" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#0072bd" text-anchor="middle">g[2] = b₂</text>
  <text x="310" y="138" font-family="Arial, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">(0.4)</text>

  <!-- k = 3, 4, 5, 6 (0.0) -->
  <circle cx="360" cy="210" r="4.5" fill="#0072bd" />
  <circle cx="410" cy="210" r="4.5" fill="#0072bd" />
  <circle cx="460" cy="210" r="4.5" fill="#0072bd" />
  <circle cx="510" cy="210" r="4.5" fill="#0072bd" />

  <!-- Dotted lines indicating region of support -->
  <path d="M 195 230 L 195 238 L 325 238 L 325 230" fill="none" stroke="#475569" stroke-width="1" />
  <text x="260" y="249" font-family="Arial, sans-serif" font-size="9.5" fill="#475569" text-anchor="middle">Suporte finito (k = 0, 1, 2)</text>

  <!-- Formula Callout -->
  <rect x="375" y="70" width="135" height="40" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
  <text x="442" y="86" font-family="Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#0f172a" text-anchor="middle">g[k] = 0, ∀ k &lt; 0</text>
  <text x="442" y="99" font-family="Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#0f172a" text-anchor="middle">e ∀ k &gt; 2</text>
</svg>
