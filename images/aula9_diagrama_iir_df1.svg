<svg width="800" height="280" viewBox="0 0 800 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Arrow Marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 Z" fill="#000000" />
    </marker>
  </defs>

  <!-- Transparent Background -->
  <rect width="100%" height="100%" fill="none" />

  <!-- Title -->
  <text x="400" y="25" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#000000" text-anchor="middle">Forma Direta I (Filtro IIR de 2ª Ordem)</text>

  <!-- ================= INPUT & FEEDFORWARD SECTION (LEFT) ================= -->
  <!-- Input Node -->
  <foreignObject x="25" y="42" width="40" height="20">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-family: Georgia, serif; font-size: 12px; color: #000000;">
      $x[k]$
    </div>
  </foreignObject>
  <circle cx="70" cy="60" r="3" fill="#000000" />
  
  <!-- Horizontal Top Feedforward Line -->
  <line x1="70" y1="60" x2="198" y2="60" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)" />
  
  <!-- Vertical Input Delay Line -->
  <line x1="100" y1="60" x2="100" y2="220" stroke="#000000" stroke-width="1.5" />
  <circle cx="100" cy="60" r="3" fill="#000000" />
  
  <!-- Delay Box 1 (Left) -->
  <rect x="75" y="90" width="50" height="30" rx="4" fill="#fcd5b5" stroke="#000000" stroke-width="1.2" />
  <foreignObject x="80" y="93" width="40" height="25">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-family: Georgia, serif; font-size: 13px; text-align: center; color: #000000;">
      $z^{-1}$
    </div>
  </foreignObject>
  
  <!-- Node after delay 1 -->
  <circle cx="100" cy="140" r="3" fill="#000000" />
  <line x1="100" y1="140" x2="198" y2="140" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)" />
  
  <!-- Delay Box 2 (Left) -->
  <rect x="75" y="170" width="50" height="30" rx="4" fill="#fcd5b5" stroke="#000000" stroke-width="1.2" />
  <foreignObject x="80" y="173" width="40" height="25">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-family: Georgia, serif; font-size: 13px; text-align: center; color: #000000;">
      $z^{-1}$
    </div>
  </foreignObject>
  
  <!-- Line after delay 2 -->
  <line x1="100" y1="220" x2="198" y2="220" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- Multipliers (Left) -->
  <!-- b0 -->
  <path d="M 200 44 L 200 76 L 235 60 Z" fill="#ffffff" stroke="#000000" stroke-width="1.2" />
  <foreignObject x="200" y="51" width="26" height="20">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-family: Georgia, serif; font-size: 13px; text-align: center; color: #000000; font-weight: bold;">
      $b_0$
    </div>
  </foreignObject>
  
  <!-- b1 -->
  <path d="M 200 124 L 200 156 L 235 140 Z" fill="#ffffff" stroke="#000000" stroke-width="1.2" />
  <foreignObject x="200" y="131" width="26" height="20">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-family: Georgia, serif; font-size: 13px; text-align: center; color: #000000; font-weight: bold;">
      $b_1$
    </div>
  </foreignObject>
  
  <!-- b2 -->
  <path d="M 200 204 L 200 236 L 235 220 Z" fill="#ffffff" stroke="#000000" stroke-width="1.2" />
  <foreignObject x="200" y="211" width="26" height="20">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-family: Georgia, serif; font-size: 13px; text-align: center; color: #000000; font-weight: bold;">
      $b_2$
    </div>
  </foreignObject>

  <!-- Feedforward Adders -->
  <!-- Bottom Adder -->
  <circle cx="280" cy="220" r="10" fill="#ffffff" stroke="#000000" stroke-width="1.2" />
  <line x1="275" y1="220" x2="285" y2="220" stroke="#000000" stroke-width="1" />
  <line x1="280" y1="215" x2="280" y2="225" stroke="#000000" stroke-width="1" />
  <line x1="235" y1="220" x2="268" y2="220" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" />
  
  <!-- Middle Adder -->
  <circle cx="280" cy="140" r="10" fill="#ffffff" stroke="#000000" stroke-width="1.2" />
  <line x1="275" y1="140" x2="285" y2="140" stroke="#000000" stroke-width="1" />
  <line x1="280" y1="135" x2="280" y2="145" stroke="#000000" stroke-width="1" />
  <line x1="235" y1="140" x2="268" y2="140" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" />
  <line x1="280" y1="210" x2="280" y2="152" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" />
  
  <!-- Connection to Main Central Line -->
  <line x1="235" y1="60" x2="358" y2="60" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="280" y1="130" x2="280" y2="85" stroke="#000000" stroke-width="1.2" />
  <line x1="280" y1="85" x2="370" y2="85" stroke="#000000" stroke-width="1.2" />
  
  <!-- Intermediate signal label v[k] -->
  <foreignObject x="270" y="38" width="60" height="20">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-family: Georgia, serif; font-size: 10px; color: #64748b;">
      $b_0 x[k]$
    </div>
  </foreignObject>
  
  <!-- ================= CENTRAL ADDER & OUTPUT SECTION ================= -->
  <!-- Main Adder -->
  <circle cx="380" cy="60" r="12" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
  <line x1="373" y1="60" x2="387" y2="60" stroke="#000000" stroke-width="1.2" />
  <line x1="380" y1="53" x2="380" y2="67" stroke="#000000" stroke-width="1.2" />
  
  <!-- Input from feedforward sum -->
  <line x1="280" y1="85" x2="380" y2="85" stroke="#000000" stroke-width="1.2" />
  <line x1="380" y1="85" x2="380" y2="74" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" />
  
  <!-- Top line connecting main adder to output -->
  <line x1="392" y1="60" x2="728" y2="60" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)" />
  <foreignObject x="735" y="42" width="40" height="20">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-family: Georgia, serif; font-size: 12px; color: #000000;">
      $y[k]$
    </div>
  </foreignObject>

  <!-- ================= FEEDBACK SECTION (RIGHT) ================= -->
  <!-- Vertical Output Delay Line -->
  <line x1="680" y1="60" x2="680" y2="220" stroke="#000000" stroke-width="1.5" />
  <circle cx="680" cy="60" r="3" fill="#000000" />
  
  <!-- Delay Box 1 (Right) -->
  <rect x="655" y="90" width="50" height="30" rx="4" fill="#fcd5b5" stroke="#000000" stroke-width="1.2" />
  <foreignObject x="660" y="93" width="40" height="25">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-family: Georgia, serif; font-size: 13px; text-align: center; color: #000000;">
      $z^{-1}$
    </div>
  </foreignObject>
  
  <!-- Node after output delay 1 -->
  <circle cx="680" cy="140" r="3" fill="#000000" />
  <line x1="680" y1="140" x2="577" y2="140" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)" />
  
  <!-- Delay Box 2 (Right) -->
  <rect x="655" y="170" width="50" height="30" rx="4" fill="#fcd5b5" stroke="#000000" stroke-width="1.2" />
  <foreignObject x="660" y="173" width="40" height="25">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-family: Georgia, serif; font-size: 13px; text-align: center; color: #000000;">
      $z^{-1}$
    </div>
  </foreignObject>
  
  <!-- Line after output delay 2 -->
  <line x1="680" y1="220" x2="577" y2="220" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- Multipliers (Right - Note: pointing left) -->
  <!-- -a1 -->
  <path d="M 575 124 L 575 156 L 540 140 Z" fill="#ffffff" stroke="#000000" stroke-width="1.2" />
  <foreignObject x="546" y="131" width="30" height="20">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-family: Georgia, serif; font-size: 13px; text-align: center; color: #000000; font-weight: bold;">
      $-a_1$
    </div>
  </foreignObject>
  
  <!-- -a2 -->
  <path d="M 575 204 L 575 236 L 540 220 Z" fill="#ffffff" stroke="#000000" stroke-width="1.2" />
  <foreignObject x="546" y="211" width="30" height="20">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-family: Georgia, serif; font-size: 13px; text-align: center; color: #000000; font-weight: bold;">
      $-a_2$
    </div>
  </foreignObject>

  <!-- Feedback Adders -->
  <!-- Bottom Feedback Adder -->
  <circle cx="480" cy="220" r="10" fill="#ffffff" stroke="#000000" stroke-width="1.2" />
  <line x1="475" y1="220" x2="485" y2="220" stroke="#000000" stroke-width="1" />
  <line x1="480" y1="215" x2="480" y2="225" stroke="#000000" stroke-width="1" />
  <line x1="540" y1="220" x2="492" y2="220" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" />
  
  <!-- Middle Feedback Adder -->
  <circle cx="480" cy="140" r="10" fill="#ffffff" stroke="#000000" stroke-width="1.2" />
  <line x1="475" y1="140" x2="485" y2="140" stroke="#000000" stroke-width="1" />
  <line x1="480" y1="135" x2="480" y2="145" stroke="#000000" stroke-width="1" />
  <line x1="540" y1="140" x2="492" y2="140" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" />
  <line x1="480" y1="210" x2="480" y2="152" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" />

  <!-- Connection back to Main Adder -->
  <line x1="480" y1="130" x2="480" y2="95" stroke="#000000" stroke-width="1.2" />
  <line x1="480" y1="95" x2="390" y2="95" stroke="#000000" stroke-width="1.2" />
  <line x1="390" y1="95" x2="390" y2="73" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)" />
  
  <!-- Feedback label under arrow -->
  <text x="440" y="112" font-family="Arial, sans-serif" font-size="9" fill="#b91c1c" text-anchor="middle">Realimentação</text>
</svg>
